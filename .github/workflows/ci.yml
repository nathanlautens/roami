name: CI

# Typecheck, lint and the database tests on every push and pull request.
# (Store builds and OTA updates are made with EAS: see RELEASE.md.)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Database tests
        run: |
          for t in db sms-hook mock open release push fixes security indexes; do
            echo "::group::test:$t"
            npm run -s "test:$t"
            echo "::endgroup::"
          done
